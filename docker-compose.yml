services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: offer_inventory
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    image: hads_gateway:latest
    build:
      context: .
      dockerfile: Gateway.API/Dockerfile
    ports:
      - "5035:5035"
    volumes:
      - ./Gateway.API/wwwroot:/app/wwwroot    # 保留静态资源映射 :contentReference[oaicite:0]{index=0}
    environment:
      SERVICES__BOOKINGAPI: "http://booking:5088"
      SERVICES__USERAPI:    "http://user:8080"
      JWT__KEY: ${JWT_KEY:?Set JWT_KEY in your environment or .env file}
      JWT__ISSUER: BusCrawler
      JWT__AUDIENCE: BusCrawlerFrontend
    deploy:
      replicas: 1

  search:
    build:
      context: .
      dockerfile: Search.API/Dockerfile
    ports:
      - "5078:5078"
    depends_on:
      - mysql
    restart: unless-stopped

  offerinventory:
    build:
      context: .
      dockerfile: OfferInventory.API/Dockerfile
    ports:
      - "5189:5189"
    depends_on:
      - mysql
    restart: unless-stopped

  booking:
    image: hads_booking:latest
    build:
      context: .
      dockerfile: Booking.API/Dockerfile
    ports:
      - "5088:5088"
    environment:
      SERVICES__PAYMENTAPI: "http://payment:5089"
      SERVICES__AVAILABILITYAPI: "http://availability:5086"
      JWT__KEY: ${JWT_KEY:?Set JWT_KEY in your environment or .env file}
      JWT__ISSUER: BusCrawler
      JWT__AUDIENCE: BusCrawlerFrontend
    depends_on:
      mysql:
        condition: service_healthy
      payment:
        condition: service_started
      availability:
        condition: service_started
    deploy:
      replicas: 1
    restart: unless-stopped

  payment:
    build:
      context: .
      dockerfile: Payment.API/Dockerfile
    expose:
      - "5089"
    depends_on:
      - mysql
    restart: unless-stopped

  availability:
    build:
      context: .
      dockerfile: Availability.API/Dockerfile
    expose:
      - "5086"
    depends_on:
      - mysql
    restart: unless-stopped

  user:
    build:
      context: .
      dockerfile: User.API/Dockerfile
    ports:
      - "5080:8080"
    depends_on:
      - mysql
    environment:
      ConnectionStrings__DefaultConnection: server=mysql;port=3306;database=user_db;user=root;password=1234
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in your environment or .env file}
      Jwt__Issuer: BusCrawler
      Jwt__Audience: BusCrawlerFrontend
    restart: unless-stopped

# 这个部分是全局的 volume 定义，必须放在文件结尾
volumes:
  mysql_data:
