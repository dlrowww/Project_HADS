<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- ① 导航栏 -->
  <div id="navbar"></div>
  <script>
    fetch('navbar.html')
      .then(r=>r.text())
      .then(html=>document.getElementById('navbar').outerHTML = html);
  </script>

  <!-- ② 页面主体 -->
  <main style="margin-left:200px; padding:2rem;">
    <div class="container">
      <h2 class="text-success mb-4">👤 User Information</h2>
      <pre id="userinfo" class="p-3 bg-light rounded border"></pre>
      <button class="btn btn-outline-danger mt-3" onclick="logout()">Logout</button>
    </div>
  </main>

  <script>
    async function loadUserInfo() {
      const token = localStorage.getItem('token');
      if (!token) {
        alert("Please log in first");
        location.href = 'login.html';
        return;
      }
      const res = await fetch('/api/auth/info', {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!res.ok) {
        alert('Invalid or expired token');
        location.href = 'login.html';
        return;
      }
      const data = await res.json();
      document.getElementById('userinfo').textContent =
        JSON.stringify(data,null,2);
    }
    function logout() {
      localStorage.removeItem('token');
      location.href = 'login.html';
    }
    loadUserInfo();
  </script>
</body>
