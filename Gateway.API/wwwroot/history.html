<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booking Result | BusCrawler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { display: flex; min-height: 100vh; background: #f6f7f8; }
    #navbar { width: 80px; }
    .main-content { width: min(760px, calc(100% - 120px)); margin: 60px auto; }
    .booking-card { background: white; border-radius: 12px; padding: 28px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    .status { font-weight: 700; }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <main class="main-content">
    <div class="booking-card">
      <h2 class="mb-4">Booking result</h2>
      <div id="message" class="text-muted">Loading booking…</div>
      <table id="booking-table" class="table d-none">
        <tbody>
          <tr><th>Booking ID</th><td id="booking-id"></td></tr>
          <tr><th>Status</th><td id="status" class="status"></td></tr>
          <tr><th>Passenger</th><td id="customer-name"></td></tr>
          <tr><th>Seats</th><td id="number-of-seats"></td></tr>
          <tr><th>Total price</th><td id="total-price"></td></tr>
          <tr><th>Created</th><td id="created-at"></td></tr>
          <tr><th>Paid</th><td id="paid-at"></td></tr>
        </tbody>
      </table>
      <a class="btn btn-success mt-3" href="search.html">Back to search</a>
    </div>
  </main>

  <script>
    fetch("navbar.html")
      .then(response => response.text())
      .then(html => { document.getElementById("navbar").outerHTML = html; });

    document.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("token");
      const bookingId = localStorage.getItem("bookingId");
      const message = document.getElementById("message");

      if (!token) {
        location.href = "login.html";
        return;
      }
      if (!bookingId) {
        message.textContent = "No recent booking was found in this browser.";
        return;
      }

      try {
        const response = await fetch(`/api/booking-proxy/${bookingId}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (response.status === 401) {
          localStorage.removeItem("token");
          location.href = "login.html";
          return;
        }
        if (response.status === 404)
          throw new Error("This booking does not exist or belongs to another user.");
        if (!response.ok)
          throw new Error(`Unable to load booking (HTTP ${response.status}).`);

        const booking = await response.json();
        document.getElementById("booking-id").textContent = booking.bookingId;
        document.getElementById("status").textContent = booking.status;
        document.getElementById("customer-name").textContent = booking.customerName;
        document.getElementById("number-of-seats").textContent = booking.numberOfSeats;
        document.getElementById("total-price").textContent = `${booking.totalPrice} ${booking.currency}`;
        document.getElementById("created-at").textContent = new Date(booking.createdAt).toLocaleString();
        document.getElementById("paid-at").textContent = booking.paidAt
          ? new Date(booking.paidAt).toLocaleString()
          : "—";
        message.classList.add("d-none");
        document.getElementById("booking-table").classList.remove("d-none");
      } catch (error) {
        message.className = "text-danger";
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
