<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | BusCrawler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #00e3ae, #9be15d); display: flex; justify-content: center; align-items: center; min-height: 100vh;">
  <div class="login-container bg-white p-4 rounded shadow" style="max-width: 400px; width: 100%;">
    <h2 class="text-center text-success mb-4">Create Account</h2>
    <form id="register-form">
      <div class="mb-3">
        <input id="username" type="email" class="form-control" placeholder="Email address" required>
      </div>
      <div class="mb-3">
        <input id="password" type="password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign Up</button>
    </form>
    <div class="text-center mt-3">
      <a href="login.html" class="btn btn-link">Already have an account? Log in</a>
    </div>
  </div>
  <script>
    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      alert(data.message || '注册成功！');
      if (res.ok) window.location.href = 'login.html';
    });
  </script>
</body>
</html>
